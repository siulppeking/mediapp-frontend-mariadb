<mat-form-field>
    <mat-label>Filter</mat-label>
    <input matInput (keyup)="applyFilter($event)" placeholder="Ex. Mia" #input>
</mat-form-field>

<div class="mat-elevation-z8">
    <table mat-table [dataSource]="dataSource" matSort>

        <ng-container matColumnDef="idMedic">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
            <td mat-cell *matCellDef="let row"> {{row.idMedic}} </td>
        </ng-container>

        <ng-container matColumnDef="primaryName">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Primary Name </th>
            <td mat-cell *matCellDef="let row"> {{row.primaryName}} </td>
        </ng-container>

        <ng-container matColumnDef="surname">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Surname </th>
            <td mat-cell *matCellDef="let row"> {{row.surname}} </td>
        </ng-container>

        <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> ACTIONS </th>
            <td mat-cell *matCellDef="let row">

                <button mat-flat-button (click)="openDialog(row)">
                    <span>Edit</span>
                    <mat-icon>mode_edit</mat-icon>
                </button>

                <button matButton="outlined" class="delete-button" (click)="delete(row)">
                    <span>Delete</span>
                    <mat-icon>delete</mat-icon>
                </button>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    </table>
</div>

<mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons aria-label="Select page">
</mat-paginator>

<button mat-flat-button color="primary" style="float: right;" (click)="openDialog()">
    <span>New</span>
    <mat-icon>add</mat-icon>
</button>
